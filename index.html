<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F7FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1115" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Tracker spese</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <h1 id="title">Tracker spese</h1>
  <div id="sync" title="Stato sincronizzazione"></div>
</header>

<main id="view"></main>

<button id="fab" aria-label="Nuovo movimento"></button>

<nav id="tabs">
  <button data-tab="home" class="active"><span class="ni" data-i="home"></span>Home</button>
  <button data-tab="movimenti"><span class="ni" data-i="receipt_long"></span>Movimenti</button>
  <button data-tab="grafici"><span class="ni" data-i="bar_chart"></span>Grafici</button>
  <button data-tab="mesi"><span class="ni" data-i="calendar_month"></span>Mesi</button>
</nav>

<div id="sheet" class="hidden" role="dialog" aria-modal="true"><div id="sheet-body"></div></div>
<div id="toast" class="hidden"></div>

<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
